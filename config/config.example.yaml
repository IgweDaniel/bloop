server:
  port: 8080
  read_timeout: 30s
  write_timeout: 30s

redis:
  url: "redis://localhost:6377"
  pool_size: 100
  min_idle_conns: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

rabbitmq:
  url: "amqp://bloop:bloop123@localhost:5673/"
  exchange: "blockchain.events"
  queue_prefix: "bloop"
  prefetch_count: 100

ethereum:
  rpc_urls:
    - "https://ethereum-sepolia-rpc.publicnode.com"
    - "https://eth-sepolia.public.blastapi.io"
  ws_url: "wss://ethereum-sepolia-rpc.publicnode.com"
  # Optional: Multiple omini RPC URLs with extended features for fetching full blocks with transactions.
  # e.g., Alchemy, Infura, or any provider that reliably returns full blocks. Rotation is supported.
  # Do not commit secrets here.
  omini_rpc_urls:
    - ""
  # Deprecated: use omini_rpc_urls instead
  # omini_rpc_url: ""
  # Rate limiting for omini clients - adjust based on your provider's limits
  # For example: Alchemy free tier is 300 req/sec, paid tiers vary
  omini_requests_per_second: 5
  omini_requests_burst: 10
  usdt_contract: "0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238"
  usdt_decimals: 6
  confirmations: 5
  batch_size: 50
  max_concurrent_blocks: 5
  # Block fetch mode: "light" uses GetBlockVerbose (fetches each tx individually with RPC rotation)
  # "full" fetches entire block with all transactions in one call (more expensive for quoted RPCs)
  block_fetch_mode: light
  tx_fetch_concurrency: 20
  rpc_timeout: 30s
  retry_attempts: 3
  retry_delay: 2s
  skip_native: false
  is_active: true

monitoring:
  scan_window: 1000
  poll_interval: 15s
  ws_retry_interval: 30s
  health_check_interval: 30s
  metrics_port: 9090

logging:
  level: "info"
  format: "json"

bitcoin:
  api_url: "https://mempool.space/testnet/api"
  api_urls:
    - "https://mempool.space/testnet/api"
    - "https://blockstream.info/testnet/api"
  ws_url: "wss://mempool.space/testnet/api/v1/ws"
  confirmations: 1
  batch_size: 10
  max_concurrent_blocks: 5
  tx_fetch_concurrency: 2
  requeue_delay: 5s
  requests_per_second: 5
  requests_burst: 10
  rpc_timeout: 30s
  retry_attempts: 3
  retry_delay: 2s

tron:
  api_url: "https://api.trongrid.io"
  api_urls:
    - "https://api.trongrid.io"
  # Set TRON_API_KEY in env for TronGrid production usage; do not commit secrets.
  api_key: ""
  # Mainnet TRC20 USDT contract. Use a test token contract on Nile/Shasta.
  usdt_contract: "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"
  usdt_decimals: 6
  # use_solidity=true reads already-solidified blocks; raise this if using full-node /wallet APIs.
  confirmations: 1
  batch_size: 25
  max_concurrent_blocks: 5
  requeue_delay: 5s
  requests_per_second: 5
  requests_burst: 10
  rpc_timeout: 30s
  retry_attempts: 3
  retry_delay: 2s
  use_solidity: true
  is_active: false

bsc:
  rpc_urls:
    - "https://bsc-testnet.public.blastapi.io"
    - "https://bsc-testnet-rpc.publicnode.com"
  ws_url: "wss://bsc-testnet-rpc.publicnode.com"
  # Multiple omini RPC URLs for rotation (premium providers with full block support)
  omini_rpc_urls:
    - ""
  # Rate limiting for omini clients
  omini_requests_per_second: 5
  omini_requests_burst: 10
  usdt_contract: "0x337610d27c682E347C9cD60BD4b3b107C9d34dDd"
  usdt_decimals: 18
  confirmations: 5
  batch_size: 50
  max_concurrent_blocks: 20
  block_fetch_mode: light
  tx_fetch_concurrency: 20
  rpc_timeout: 30s
  retry_attempts: 3
  retry_delay: 2s
  skip_native: true
  is_active: true
